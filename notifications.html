<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الإشعارات | مواصيل</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link rel="stylesheet" href="assets/style.css"></head><body><div class="loading" id="loading"><div class="loader"></div></div><div class="app"><aside class="side"><div class="brand"><a href="index.html"><img src="https://i.ibb.co/678mybGy/image.png" alt="مواصيل"></a><span class="side-badge">DASH</span></div><nav class="nav"><a data-nav="home" href="index.html"><i class="fa-solid fa-house"></i>الرئيسية</a><a data-nav="orders" href="orders.html"><i class="fa-solid fa-bag-shopping"></i>طلباتي</a><a data-nav="earnings" href="earnings.html"><i class="fa-solid fa-wallet"></i>أرباحي</a><a data-nav="activity" href="activity.html"><i class="fa-solid fa-clock-rotate-left"></i>النشاط</a><a data-nav="notifications" href="notifications.html"><i class="fa-solid fa-bell"></i>الإشعارات</a><a data-nav="settings" href="settings.html"><i class="fa-solid fa-gear"></i>الإعدادات</a></nav><div class="side-footer"><a class="back" href="https://mawaseel.ps/partner.html"><i class="fa-solid fa-arrow-up-right-from-square"></i> مركز الشريك</a><button data-logout><i class="fa-solid fa-arrow-right-from-bracket"></i> تسجيل خروج</button></div></aside><main class="main"><header class="topbar"><div class="top-title"><strong>الإشعارات</strong><span>كل جديد على طلباتك</span></div><div class="top-actions"><button class="icon-btn" data-theme aria-label="المظهر"><i class="fa-regular fa-moon"></i></button><a class="profile-mini" href="settings.html"><div class="avatar" data-avatar>MW</div><span data-user-name>شريك مواصيل</span></a></div></header><div class="shell"><section class="page-head"><div><div class="eyebrow">الإشعارات</div><h1>آخر التحديثات.</h1><p>أي تغيير جديد على طلباتك رح تشوفه هون على شكل إشعار واضح.</p></div><button class="btn soft" id="mark"><i class="fa-solid fa-check-double"></i> تعليم كمقروء</button></section><section class="panel" id="notices"><div class="empty"><div><i class="fa-regular fa-bell"></i><strong>ما في إشعارات</strong><p>لما تتحدث حالة طلب، رح يظهر هون.</p></div></div></section></div></main></div><nav class="bottom-nav"><a data-nav="home" href="index.html"><i class="fa-solid fa-house"></i><span>الرئيسية</span></a><a data-nav="orders" href="orders.html"><i class="fa-solid fa-bag-shopping"></i><span>طلباتي</span></a><a data-nav="earnings" href="earnings.html"><i class="fa-solid fa-wallet"></i><span>أرباحي</span></a><a data-nav="activity" href="activity.html"><i class="fa-solid fa-clock-rotate-left"></i><span>النشاط</span></a><a data-nav="notifications" href="notifications.html"><i class="fa-solid fa-bell"></i><span>الإشعارات</span></a></nav><div class="toast" id="toast">تم</div><script type="module">import {activePage} from './assets/app.js';activePage('notifications');import {state,eventsFromOrders,statusMeta,ago,esc,toast} from './assets/app.js';function render(){const ev=eventsFromOrders(state.orders).slice(0,30),n=document.getElementById('notices');if(!ev.length)return;n.innerHTML=ev.map(e=>{const [l]=statusMeta[e.status]||[e.status];return `<a class="notice" href="order.html?id=${encodeURIComponent(e.order.id)}"><div class="ni"><i class="fa-solid fa-box"></i></div><div><strong>طلب ${esc(e.order.customerName||'زبون')} صار: ${l}</strong><p>${esc(e.order.orderNumber||'')} · افتح الطلب للتفاصيل</p></div><time>${ago(e.at)}</time></a>`}).join('')}window.addEventListener('orders-ready',render);document.getElementById('mark').onclick=()=>toast('تم تعليم الإشعارات كمقروءة على هذا الجهاز');</script></body></html>
