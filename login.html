<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>دخول الداشبورد | مواصيل</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link rel="stylesheet" href="assets/style.css"><style>.login-wrap{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}.login-side{display:grid;place-items:center;padding:6vw}.login-card{width:min(430px,100%)}.login-card img{height:42px;margin-bottom:55px}.login-card h1{font-size:2.5rem;margin:0 0 8px}.login-card p{color:var(--muted);font-weight:650;margin:0 0 28px}.field{margin-bottom:14px}.field label{font-size:.72rem;font-weight:900;display:block;margin-bottom:7px}.field input{width:100%;height:52px;border-radius:16px;border:1px solid var(--line);background:var(--panel);padding:0 15px;color:var(--ink);outline:0;font-weight:700}.field input:focus{border-color:var(--brand);box-shadow:0 0 0 4px rgba(255,75,22,.1)}.login-card .btn{width:100%;height:52px;margin-top:8px}.visual{background:#111114;color:#fff;display:flex;align-items:flex-end;padding:6vw;position:relative;overflow:hidden}.visual:before{content:'MW';position:absolute;font-size:32vw;font-weight:900;opacity:.04;top:-15%;left:-8%}.visual h2{font-size:clamp(3rem,7vw,7rem);line-height:.9;margin:0;position:relative}.visual h2 span{color:var(--brand)}.back-link{display:block;margin-top:22px;color:var(--muted);font-weight:800;font-size:.75rem;text-align:center}.err{display:none;background:#fff1ef;color:#c03a24;padding:10px 12px;border-radius:12px;font-size:.72rem;font-weight:800;margin-bottom:13px}.social-login{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}.social-btn{height:50px;border-radius:16px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-family:inherit;font-weight:900;display:flex;align-items:center;justify-content:center;gap:9px;cursor:pointer;transition:.25s}.social-btn:hover{transform:translateY(-2px);border-color:var(--ink);box-shadow:0 8px 22px rgba(0,0,0,.06)}.social-btn:disabled{opacity:.55;cursor:not-allowed;transform:none}.google-icon{width:19px;height:19px}.facebook-icon{color:#1877F2;font-size:1.25rem}.divider{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:.72rem;font-weight:900;margin:18px 0}.divider:before,.divider:after{content:'';height:1px;background:var(--line);flex:1}.social-note{font-size:.68rem;color:var(--muted);font-weight:700;line-height:1.7;margin-top:10px;text-align:center}@media(max-width:800px){.login-wrap{display:block}.visual{display:none}.login-side{min-height:100vh;padding:8vw 5%}.login-card img{margin-bottom:40px}}@media(max-width:430px){.social-login{grid-template-columns:1fr}}</style></head><body><div class="login-wrap"><section class="login-side"><form class="login-card" id="form"><a href="https://mawaseel.ps/partner.html"><img src="https://i.ibb.co/678mybGy/image.png" alt="مواصيل"></a><h1>فوت ع الداشبورد.</h1><p>سجّل بنفس حساب الشريك تبعك. الداشبورد على دومين مستقل، فإله جلسة دخول خاصة فيه.</p><div class="err" id="err"></div><div class="social-login"><button type="button" class="social-btn" id="google-btn" aria-label="تسجيل الدخول عبر جوجل"><svg class="google-icon" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg><span>كمّل مع جوجل</span></button><button type="button" class="social-btn" id="facebook-btn" aria-label="تسجيل الدخول عبر فيسبوك"><i class="fa-brands fa-facebook facebook-icon"></i><span>كمّل مع فيسبوك</span></button></div><div class="divider">أو باستخدام الإيميل</div><div class="field"><label>الإيميل</label><input id="email" type="email" required placeholder="name@example.com"></div><div class="field"><label>كلمة السر</label><input id="pass" type="password" required placeholder="••••••••"></div><button class="btn brand" id="submit">فوت ع الداشبورد <i class="fa-solid fa-arrow-left"></i></button><a class="back-link" href="https://mawaseel.ps/partner.html">رجوع لمركز الشريك</a></form></section><section class="visual"><h2>طلباتك.<br><span>أرباحك.</span><br>لحظة بلحظة.</h2></section></div><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js';import{getAuth,signInWithEmailAndPassword,onAuthStateChanged,setPersistence,browserLocalPersistence,GoogleAuthProvider,FacebookAuthProvider,signInWithPopup}from'https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js';import{getFirestore,doc,getDoc}from'https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js';const app=initializeApp({apiKey:"AIzaSyBC4KevTkZ_myJZ5kG7LXqAALUVSdLsnHE",authDomain:"mawaseel.firebaseapp.com",projectId:"mawaseel",storageBucket:"mawaseel.firebasestorage.app",messagingSenderId:"877553024815",appId:"1:877553024815:web:bdd1a3c4b352e915e06bda",measurementId:"G-7X5GBYVJ9M"}),auth=getAuth(app),db=getFirestore(app);const googleProvider=new GoogleAuthProvider(),facebookProvider=new FacebookAuthProvider();googleProvider.setCustomParameters({prompt:'select_account'});facebookProvider.addScope('email');await setPersistence(auth,browserLocalPersistence).catch(()=>{});async function route(u){const s=await getDoc(doc(db,'users',u.uid));if(!s.exists()){location.href='https://mawaseel.ps/login.html?view=register';return}const d=s.data();location.replace(d.role==='admin'||d.isAdmin===true?'https://admin.mawaseel.ps/':'index.html')}onAuthStateChanged(auth,u=>{if(u)route(u)});document.getElementById('form').onsubmit=async e=>{e.preventDefault();const b=document.getElementById('submit'),er=document.getElementById('err');er.style.display='none';b.disabled=true;b.innerHTML='<i class="fa-solid fa-spinner fa-spin"></i> لحظة';try{const c=await signInWithEmailAndPassword(auth,email.value,pass.value);await route(c.user)}catch(x){er.textContent='الإيميل أو كلمة السر غلط.';er.style.display='block'}finally{b.disabled=false;b.innerHTML='فوت ع الداشبورد <i class="fa-solid fa-arrow-left"></i>'}};const errBox=document.getElementById('err');function authMessage(x){if(x?.code==='auth/popup-closed-by-user')return 'سكرت نافذة تسجيل الدخول قبل ما تكمّل.';if(x?.code==='auth/popup-blocked')return 'المتصفح منع نافذة تسجيل الدخول. اسمح بالنوافذ المنبثقة وجرب مرة ثانية.';if(x?.code==='auth/account-exists-with-different-credential')return 'هذا الإيميل مربوط بطريقة دخول ثانية. فوت بالطريقة اللي أنشأت فيها الحساب أول مرة.';if(x?.code==='auth/operation-not-allowed')return 'طريقة تسجيل الدخول هاي مش مفعّلة من Firebase لسا.';return 'صارت مشكلة بتسجيل الدخول. جرّب مرة ثانية.'}async function socialLogin(provider,btn){errBox.style.display='none';const old=btn.innerHTML;btn.disabled=true;btn.innerHTML='<i class="fa-solid fa-spinner fa-spin"></i> لحظة';try{const r=await signInWithPopup(auth,provider);await route(r.user)}catch(x){console.error(x);errBox.textContent=authMessage(x);errBox.style.display='block'}finally{btn.disabled=false;btn.innerHTML=old}}document.getElementById('google-btn').onclick=()=>socialLogin(googleProvider,document.getElementById('google-btn'));document.getElementById('facebook-btn').onclick=()=>socialLogin(facebookProvider,document.getElementById('facebook-btn'));</script></body></html>
